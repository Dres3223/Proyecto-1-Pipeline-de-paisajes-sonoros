# Hooks that run on every `git commit`.
# Install (once):       uv run pre-commit install
# Check the whole repo: uv run pre-commit run --all-files
repos:
  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # A BirdCLEF recording is ~470 KB: a 300 KB limit keeps them all out of the repo
      - id: check-added-large-files
        args: ["--maxkb=300"]

  # Python: linter and formatter (same version as in pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Bash: common mistakes in the scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
